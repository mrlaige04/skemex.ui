<div class="flex flex-col gap-6 p-4 md:p-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Settings</h1>
    <p class="text-muted-foreground mt-1 text-sm">Manage workspace preferences, roles, and defaults.</p>
  </div>

  <div hlmTabs [tab]="activeTab()" (tabActivated)="onTabActivated($event)">
    <div hlmTabsList variant="line">
      <button
        type="button"
        hlmTabsTrigger="columns"
        *hasPermission="permissions.settingsColumnsView"
      >
        Columns
      </button>
      <button
        type="button"
        hlmTabsTrigger="specializations"
        *hasPermission="permissions.settingsSpecializationsView"
      >
        Specializations
      </button>
      <button type="button" hlmTabsTrigger="roles" *hasPermission="permissions.settingsRolesView">
        Roles
      </button>
    </div>

    <div hlmTabsContent="columns" class="pt-4" *hasPermission="permissions.settingsColumnsView">
      <app-settings-columns-tab />
    </div>

    <div
      hlmTabsContent="specializations"
      class="pt-4"
      *hasPermission="permissions.settingsSpecializationsView"
    >
      <app-settings-specializations-tab />
    </div>

    <div hlmTabsContent="roles" class="pt-4" *hasPermission="permissions.settingsRolesView">
      <app-roles-page [embedded]="true" />
    </div>
  </div>
</div>
