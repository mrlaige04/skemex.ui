<div class="flex flex-1 flex-col gap-4 p-4 md:p-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
      <p class="text-muted-foreground mt-1 text-sm">Manage members of this workspace.</p>
    </div>
    <a hlmBtn [routerLink]="usersNewLink()">
      <ng-icon hlm name="lucideUserPlus" size="sm" />
      Add user
    </a>
  </div>

  <div hlmCard class="users-card">
    <div hlmCardContent>
      @if (listError(); as err) {
        <p
          class="mb-4 rounded-md border border-red-500/30 bg-red-950/20 px-3 py-2 text-sm text-red-700 dark:text-red-300"
          role="alert"
        >
          {{ err }}
        </p>
      }

      <app-rich-table
        [data]="users()"
        [columns]="columns"
        [loading]="loading()"
        emptyMessage="No users match your search."
        [showPagination]="true"
        [pageNumber]="currentPage()"
        [page]="pageSize()"
        [totalItems]="totalItems()"
        (paginationChange)="onPaginationChange($event)"
      >
        <ng-template #captionStartTemplate>
          <div hlmInputGroup class="w-full max-w-sm">
            <div hlmInputGroupAddon>
              <ng-icon hlm name="lucideSearch" size="sm" class="text-muted-foreground" />
            </div>
            <input
              hlmInputGroupInput
              type="search"
              placeholder="Search users…"
              [value]="searchInput()"
              (input)="onSearchInput($event)"
            />
          </div>
        </ng-template>
      </app-rich-table>
    </div>
  </div>

  <app-confirm-alert-dialog
    [(state)]="confirmDialogState"
    title="Remove user?"
    confirmLabel="Remove"
    (confirmed)="confirmDeleteUser()"
  >
    Remove
    <span class="font-medium text-foreground">{{ pendingDeleteUserName() }}</span>
    from this workspace?
  </app-confirm-alert-dialog>
</div>
