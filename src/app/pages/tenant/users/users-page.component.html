<div class="flex flex-1 flex-col gap-4 p-4 md:p-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
      <p class="text-muted-foreground mt-1 text-sm">Manage members of this workspace.</p>
    </div>
    <a hlmBtn [routerLink]="usersNewLink()">
      <ng-icon hlm name="lucideUserPlus" size="sm" />
      Add user
    </a>
  </div>

  <div hlmCard class="users-card">
    <div hlmCardHeader>
      <div hlmInputGroup class="w-full max-w-sm">
        <div hlmInputGroupAddon>
          <ng-icon hlm name="lucideSearch" size="sm" class="text-muted-foreground" />
        </div>
        <input
          hlmInputGroupInput
          type="search"
          placeholder="Search users…"
          [value]="searchInput()"
          (input)="onSearchInput($event)"
        />
      </div>
    </div>

    <div hlmCardContent>
      @if (loading()) {
        <p class="text-muted-foreground px-4 py-3 text-sm">Loading…</p>
      }

      @if (listError(); as err) {
        <p
          class="mx-4 my-2 rounded-md border border-red-500/30 bg-red-950/20 px-3 py-2 text-sm text-red-700 dark:text-red-300"
          role="alert"
        >
          {{ err }}
        </p>
      }

      <app-rich-table
        [data]="users()"
        [columns]="columns"
        [loading]="loading()"
        emptyMessage="No users match your search."
        [showPagination]="true"
        [pageNumber]="currentPage()"
        [page]="pageSize()"
        [totalItems]="totalItems()"
        (paginationChange)="onPaginationChange($event)"
      />
    </div>
  </div>
</div>
