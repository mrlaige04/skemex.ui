<div class="flex flex-1 flex-col gap-4 p-4 md:p-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
    <p class="text-muted-foreground mt-1 text-sm">
      @if (projectName()) {
        Members assigned to {{ projectName() }}.
      } @else {
        Members assigned to this project.
      }
    </p>
  </div>
  <div hlmCard>
    <div hlmCardContent>
      @if (listError(); as err) {
        <p
          class="mb-4 rounded-md border border-red-500/30 bg-red-950/20 px-3 py-2 text-sm text-red-700 dark:text-red-300"
          role="alert"
        >
          {{ err }}
        </p>
      }
      <app-rich-table
        [data]="users()"
        [columns]="columns"
        [loading]="loading()"
        emptyMessage="No users match your search."
        [showPagination]="true"
        [showColumnsSelection]="false"
        [pageNumber]="currentPage()"
        [page]="pageSize()"
        [totalItems]="totalItems()"
        (paginationChange)="onPaginationChange($event)"
      >
        <ng-template #captionStartTemplate>
          <div hlmInputGroup class="w-full max-w-sm">
            <div hlmInputGroupAddon>
              <ng-icon hlm name="lucideSearch" size="sm" class="text-muted-foreground" />
            </div>
            <input
              hlmInputGroupInput
              type="search"
              placeholder="Search users…"
              [value]="searchInput()"
              (input)="onSearchInput($event)"
            />
          </div>
        </ng-template>
      </app-rich-table>
    </div>
  </div>
</div>
