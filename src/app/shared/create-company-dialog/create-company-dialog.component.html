<hlm-dialog
  [state]="state()"
  (stateChanged)="onStateChanged($event)"
  (closed)="onClosed()"
>
  <hlm-dialog-content *hlmDialogPortal class="tenant-dialog">
    <hlm-dialog-header class="tenant-dialog__header">
      <h2 hlmDialogTitle class="tenant-dialog__title">New company</h2>
      <p hlmDialogDescription class="tenant-dialog__desc">
        This becomes a separate workspace. You’ll be the admin.
      </p>
    </hlm-dialog-header>

    <form novalidate (submit)="onSubmit($event)" class="tenant-dialog__form">
      @for (err of createForm().errorSummary(); track err.kind + (err.message ?? '')) {
        @if (err.kind === 'server') {
          <p class="auth-alert auth-alert--error" role="alert">{{ err.message }}</p>
        }
      }

      <div class="tenant-dialog__field">
        <label hlmLabel for="company-name" class="tenant-dialog-label">Company name</label>
        <div hlmInputGroup class="auth-input-group">
          <input
            hlmInputGroupInput
            id="company-name"
            type="text"
            autocomplete="organization"
            [formField]="createForm.name"
            placeholder="Acme Inc."
          />
        </div>
      </div>

      <div class="tenant-dialog__field">
        <label hlmLabel for="company-email" class="tenant-dialog-label">Company email</label>
        <div hlmInputGroup class="auth-input-group">
          <input
            hlmInputGroupInput
            id="company-email"
            type="email"
            autocomplete="email"
            [formField]="createForm.email"
            placeholder="billing@company.com"
          />
        </div>
      </div>

      <hlm-dialog-footer class="tenant-dialog__footer">
        <button type="button" class="tenant-dialog__cancel" hlmDialogClose [disabled]="creating()">
          Cancel
        </button>
        <button type="submit" class="auth-submit-btn tenant-dialog__submit" [disabled]="creating()">
          {{ creating() ? 'Creating…' : 'Create workspace' }}
        </button>
      </hlm-dialog-footer>
    </form>
  </hlm-dialog-content>
</hlm-dialog>
